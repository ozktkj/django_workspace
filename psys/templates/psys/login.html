{% extends "base.html" %}

{% block title %}
ログイン
{% endblock %}

{% block content %}
    <form method="POST" action="{% url 'psys:login' %}">
        {% csrf_token %}

        <!-- エラーメッセージ -->
        {% if error_message %}
          <div class="alert alert-danger py-2 small" role="alert">
            {{ error_message }}
          </div>
        {% endif %}

        <!-- 従業員番号 -->
        <div class="mb-3">
          <label for="{{ form.employee_no.id_for_label }}" class="form-label">{{ form.employee_no.label }}</label>
          {{ form.employee_no }}
        </div>

        <!-- パスワード -->
        <div class="mb-4">
          <label for="{{ form.password.id_for_label }}" class="form-label">{{ form.password.label }}</label>
          {{ form.password }}
        </div>

        <!-- ログインボタン -->
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">ログイン</button>
        </div>

      </form>
   
{% endblock %}
